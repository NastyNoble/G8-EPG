name: Daily EPG Generation

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Execute Compilation Script
      run: python merge_epg.py

    - name: Commit and Save File Artifacts
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add my_combined_epg.xml.gz
        git commit -m "Automated Daily EPG Update" || echo "No data delta found to commit"
        git push
