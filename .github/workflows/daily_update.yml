name: Daily EPG Generation

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Double-enforces write permissions at the script level

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Execute Compilation Script
      run: python merge_epg.py

    - name: Commit and Save File Artifacts
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add my_combined_epg.xml.gz
        git commit -m "Automated Daily EPG Update" || echo "No changes to commit"
        git push origin HEAD:main # Explicitly forces it to push straight into your main directory
